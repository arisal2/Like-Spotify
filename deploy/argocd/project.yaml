apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bedlam-like-music-test
  namespace: argocd-test
spec:
  description: Docker Desktop test workloads for Bedlam-Like-Music
  sourceRepos:
    - https://github.com/arisal2/Bedlam-Like-Music.git
  destinations:
    - namespace: bedlam-like-music-test
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: ReplicaSet
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: NetworkPolicy
  orphanedResources:
    warn: true
