apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bedlam-like-music-production
  namespace: argocd-production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bedlam-like-music-production
  source:
    repoURL: https://github.com/arisal2/Bedlam-Like-Music.git
    targetRevision: deploy/production
    path: deploy/k8s/production
  destination:
    server: https://kubernetes.default.svc
    namespace: bedlam-like-music-production
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
