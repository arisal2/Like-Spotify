apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bedlam-like-music
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bedlam-like-music
  source:
    repoURL: https://github.com/arisal2/Bedlam-Like-Music.git
    targetRevision: deploy/local
    path: deploy/k8s/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: bedlam-like-music
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
