# Template for a hosted cluster. Requires a Gateway API controller, a matching
# GatewayClass, DNS, and an existing TLS Secret named music-tls in this namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: music
  namespace: like-spotify
spec:
  gatewayClassName: replace-with-installed-gateway-class
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: music.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: music-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: music
  namespace: like-spotify
spec:
  parentRefs:
    - name: music
      sectionName: https
  hostnames:
    - music.example.com
  rules:
    - backendRefs:
        - name: web
          port: 8080
