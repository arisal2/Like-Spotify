apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bedlam-like-music-staging
resources:
  - ../remote
images:
  - name: bedlam-like-music-api:local
    newName: ghcr.io/arisal2/bedlam-like-music/api
    newTag: main
  - name: bedlam-like-music-web:local
    newName: ghcr.io/arisal2/bedlam-like-music/web
    newTag: main
patches:
  - path: config-patch.yaml
  - target:
      version: v1
      kind: Namespace
      name: bedlam-like-music
    patch: |-
      - op: replace
        path: /metadata/name
        value: bedlam-like-music-staging
