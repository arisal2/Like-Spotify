apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: like-spotify
resources:
  - ../base
  - ../local-access
secretGenerator:
  - name: app-secrets
    envs:
      - secrets.env
generatorOptions:
  disableNameSuffixHash: true
replicas:
  - name: api
    count: 1
  - name: web
    count: 1
