apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bedlam-like-music-production
resources:
  - ../base
  - ../retained-storage
  - service.yaml
images:
  - name: bedlam-like-music-web:local
    newName: ghcr.io/arisal2/bedlam-like-music/web
    newTag: b86fe63777202f250957b4026f86b89bc9e8cdf1
patches:
  - path: scale-patch.yaml
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: bedlam-like-music
      $patch: delete
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          bedlam.io/environment: production
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: bedlam.io/environment
            operator: Equal
            value: production
            effect: NoSchedule
