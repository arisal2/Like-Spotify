apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bedlam-like-music-production
resources:
  - ../remote
  - service.yaml
images:
  - name: bedlam-like-music-api:local
    newName: ghcr.io/arisal2/bedlam-like-music/api
    newTag: production
  - name: bedlam-like-music-web:local
    newName: ghcr.io/arisal2/bedlam-like-music/web
    newTag: production
patches:
  - path: config-patch.yaml
  - path: scale-patch.yaml
  - path: observability-api-ingress-patch.yaml
    target:
      kind: NetworkPolicy
      name: api
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: bedlam-like-music
      $patch: delete
  - target:
      kind: (Deployment|StatefulSet|Job)
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          bedlam.io/environment: production
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: bedlam.io/environment
            operator: Equal
            value: production
            effect: NoSchedule
