apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bedlam-like-music-production
resources:
  - ../remote
  - service.yaml
images:
  - name: bedlam-like-music-api:local
    newName: ghcr.io/arisal2/bedlam-like-music/api
    newTag: 9bc4c74de743a3d6eb397329e1d439ed58cee475
  - name: bedlam-like-music-web:local
    newName: ghcr.io/arisal2/bedlam-like-music/web
    newTag: fe1ef4b07afd5ba1bb54276c73b855b1e49a2e73
patches:
  - path: config-patch.yaml
  - path: scale-patch.yaml
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: bedlam-like-music
      $patch: delete
  - target:
      kind: (Deployment|StatefulSet|Job)
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          bedlam.io/environment: production
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: bedlam.io/environment
            operator: Equal
            value: production
            effect: NoSchedule
