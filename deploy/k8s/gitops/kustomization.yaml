apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: like-spotify
resources:
  - ../base
  - migration-job.yaml
  - media-pvc.yaml
  - ../local-access
images:
  - name: like-spotify-api:local
    newName: ghcr.io/arisal2/like-spotify/api
    newTag: e45791a43791f47e5d297319be5354ead6e65630
  - name: like-spotify-web:local
    newName: ghcr.io/arisal2/like-spotify/web
    newTag: e45791a43791f47e5d297319be5354ead6e65630
patches:
  - path: config-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: media
            persistentVolumeClaim:
              claimName: media
              readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: media
            mountPath: /media
            readOnly: true
