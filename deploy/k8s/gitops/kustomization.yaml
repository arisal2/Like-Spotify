apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: like-spotify
resources:
  - ../base
  - migration-job.yaml
images:
  - name: like-spotify-api:local
    newName: ghcr.io/arisal2/like-spotify/api
    newTag: main
  - name: like-spotify-web:local
    newName: ghcr.io/arisal2/like-spotify/web
    newTag: main
patches:
  - path: config-patch.yaml
