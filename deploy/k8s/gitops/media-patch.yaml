apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          volumeMounts:
            - name: media
              mountPath: /media
              readOnly: true
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
            readOnly: true
