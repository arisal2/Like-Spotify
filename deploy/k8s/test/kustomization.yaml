apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bedlam-like-music-test
resources:
  - ../remote
  - ../local-access
images:
  - name: bedlam-like-music-api:local
    newName: ghcr.io/arisal2/bedlam-like-music/api
    newTag: 9eb9c50f12c01d4800f30b5c0ebda7f325567757
  - name: bedlam-like-music-web:local
    newName: ghcr.io/arisal2/bedlam-like-music/web
    newTag: db24a161224ecaa938b8efc2d5acdbd1ca333aa1
patches:
  - path: config-patch.yaml
  - path: observability-api-ingress-patch.yaml
    target:
      kind: NetworkPolicy
      name: api
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: bedlam-like-music
      $patch: delete
  - target:
      kind: (Deployment|StatefulSet|Job)
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          bedlam.io/environment: test
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: bedlam.io/environment
            operator: Equal
            value: test
            effect: NoSchedule
