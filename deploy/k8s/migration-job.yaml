# Run and wait for this Job before applying the application Deployments.
# Use the same immutable API image tag as the release being deployed.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-v1
  namespace: like-spotify
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: like-spotify-api:local
          imagePullPolicy: IfNotPresent
          args: ['migrate']
          env:
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_DSN
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: '1'
              memory: 128Mi
