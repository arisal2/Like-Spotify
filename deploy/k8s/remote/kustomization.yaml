apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - migration-job.yaml
  - media-pvc.yaml
images:
  - name: bedlam-like-music-api:local
    newName: ghcr.io/arisal2/bedlam-like-music/api
    newTag: main
  - name: bedlam-like-music-web:local
    newName: ghcr.io/arisal2/bedlam-like-music/web
    newTag: main
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: media
            persistentVolumeClaim:
              claimName: media
              readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: media
            mountPath: /media
            readOnly: true
