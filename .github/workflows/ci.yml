name: Test and package
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      browser: ${{ steps.paths.outputs.browser }}
      kubernetes: ${{ steps.paths.outputs.kubernetes }}
      security: ${{ steps.paths.outputs.security }}
      documentation: ${{ steps.paths.outputs.documentation }}
      container-images: ${{ steps.paths.outputs.container-images }}
      container-matrix: ${{ steps.paths.outputs.container-matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        name: Select checks from changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          backend=false
          frontend=false
          browser=false
          kubernetes=false
          security=false
          documentation=false
          container_api=false
          container_web=false

          if [ "$EVENT_NAME" = 'workflow_call' ]; then
            backend=true
            frontend=true
            browser=true
            kubernetes=true
            security=true
            documentation=true
            container_api=true
            container_web=true
          else
            if [ "$EVENT_NAME" = 'pull_request' ]; then
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
            else
              base="$BEFORE_SHA"
              head="$CURRENT_SHA"
              if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
                base="${head}^"
              fi
            fi

            while IFS= read -r path; do
              case "$path" in
                backend/*)
                  backend=true; browser=true; security=true; container_api=true ;;
                web/*)
                  frontend=true; browser=true; security=true; container_web=true ;;
                deploy/*)
                  kubernetes=true; security=true ;;
                .github/workflows/*)
                  backend=true; frontend=true; browser=true; kubernetes=true; security=true; container_api=true; container_web=true ;;
                .dockerignore)
                  backend=true; frontend=true; browser=true; security=true; container_api=true; container_web=true ;;
                .github/dependabot.yml|compose.yaml|.env.example)
                  backend=true; frontend=true; browser=true; security=true ;;
                *.md|docs/*)
                  documentation=true ;;
                *)
                  security=true ;;
              esac
            done < <(git diff --name-only "$base" "$head")
          fi

          container_images=false
          container_include='[]'
          if [ "$container_api" = true ]; then
            container_images=true
            container_include=$(jq -c '. + [{"component":"api","dockerfile":"backend/Dockerfile"}]' <<< "$container_include")
          fi
          if [ "$container_web" = true ]; then
            container_images=true
            container_include=$(jq -c '. + [{"component":"web","dockerfile":"web/Dockerfile"}]' <<< "$container_include")
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "browser=$browser"
            echo "kubernetes=$kubernetes"
            echo "security=$security"
            echo "documentation=$documentation"
            echo "container-images=$container_images"
            echo "container-matrix={\"include\":$container_include}"
          } >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-password"
          --health-interval=5s --health-timeout=3s --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          TEST_MYSQL_DSN: "root:ci-test-password@tcp(127.0.0.1:3306)/?parseTime=true"
      - name: Check Go dependencies for known vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
          work-dir: backend
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
  dependency-review:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Block newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # GitHub's dependency graph currently misses the MIT metadata for
          # these two official actions. Keep this exception package-specific.
          allow-dependencies-licenses: >-
            pkg:githubactions/actions/checkout,
            pkg:githubactions/azure/setup-kubectl
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bedlam_like_music
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-password"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@12.2.2
      - run: npm ci
        working-directory: web
      - name: Generate disposable audio fixture
        run: |
          mkdir -p assets/music assets/images/artwork
          node web/e2e/generate-audio.mjs assets/music/ci-tone.wav
      - name: Build and migrate API
        working-directory: backend
        env:
          DATABASE_DSN: "root:ci-test-password@tcp(127.0.0.1:3306)/bedlam_like_music?parseTime=true"
        run: |
          go build -o /tmp/bedlam-like-music-api ./cmd/server
          /tmp/bedlam-like-music-api migrate
      - name: Start API and Vite
        env:
          DATABASE_DSN: "root:ci-test-password@tcp(127.0.0.1:3306)/bedlam_like_music?parseTime=true"
          APP_ORIGIN: "http://127.0.0.1:5173"
          MEDIA_DIR: ${{ github.workspace }}/assets
        run: |
          /tmp/bedlam-like-music-api >/tmp/bedlam-like-music-api.log 2>&1 &
          echo $! >/tmp/bedlam-like-music-api.pid
          (cd web && npm run dev >/tmp/bedlam-like-music-web.log 2>&1 & echo $! >/tmp/bedlam-like-music-web.pid)
      - name: Wait for application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail http://127.0.0.1:5173/api/v1/catalog >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bedlam-like-music-api.log /tmp/bedlam-like-music-web.log
          exit 1
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        env:
          E2E_AUDIO_FIXTURE: "1"
          E2E_BASE_URL: "http://127.0.0.1:5173"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          path: web/test-results
      - name: Show service logs
        if: failure()
        run: cat /tmp/bedlam-like-music-api.log /tmp/bedlam-like-music-web.log
      - name: Stop test services
        if: always()
        run: |
          if [ -f /tmp/bedlam-like-music-api.pid ]; then kill "$(cat /tmp/bedlam-like-music-api.pid)" || true; fi
          if [ -f /tmp/bedlam-like-music-web.pid ]; then kill "$(cat /tmp/bedlam-like-music-web.pid)" || true; fi

  containers:
    needs: changes
    if: needs.changes.outputs.container-images == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.container-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: bedlam-like-music-${{ matrix.component }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.component }}

  kubernetes:
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
      - run: kubectl kustomize deploy/k8s/base > /tmp/base.yaml
      - run: cp deploy/k8s/local/secrets.env.example deploy/k8s/local/secrets.env
      - run: kubectl kustomize deploy/k8s/local > /tmp/local.yaml
      - run: kubectl kustomize deploy/k8s/gitops > /tmp/gitops.yaml
      - run: kubectl kustomize deploy/k8s/staging > /tmp/staging.yaml
      - run: kubectl kustomize deploy/k8s/production > /tmp/production.yaml
      - run: kubectl kustomize deploy/argocd > /tmp/argocd.yaml
      - run: kubectl kustomize deploy/argocd/environments > /tmp/argocd-environments.yaml
  security-config:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan repository and deployment configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  documentation:
    needs: changes
    if: needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@12.2.2
      - run: npm ci
        working-directory: web
      - name: Check Markdown formatting
        run: web/node_modules/.bin/prettier --check README.md SECURITY.md docs/*.md

  ci-gate:
    if: always()
    needs:
      [
        changes,
        backend,
        frontend,
        browser,
        containers,
        kubernetes,
        security-config,
        documentation,
        dependency-review,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER: ${{ needs.browser.result }}
          CONTAINERS: ${{ needs.containers.result }}
          KUBERNETES: ${{ needs.kubernetes.result }}
          SECURITY: ${{ needs.security-config.result }}
          DOCUMENTATION: ${{ needs.documentation.result }}
          DEPENDENCIES: ${{ needs.dependency-review.result }}
        run: |
          [ "$CHANGES" = 'success' ]
          for result in "$BACKEND" "$FRONTEND" "$BROWSER" "$CONTAINERS" "$KUBERNETES" "$SECURITY" "$DOCUMENTATION" "$DEPENDENCIES"; do
            if [ "$result" != 'success' ] && [ "$result" != 'skipped' ]; then
              echo "A selected CI job did not pass: $result"
              exit 1
            fi
          done
