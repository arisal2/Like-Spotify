name: Test and package
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      browser: ${{ steps.paths.outputs.browser }}
      kubernetes: ${{ steps.paths.outputs.kubernetes }}
      security: ${{ steps.paths.outputs.security }}
      documentation: ${{ steps.paths.outputs.documentation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        name: Select checks from changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          backend=false
          frontend=false
          browser=false
          kubernetes=false
          security=false
          documentation=false

          if [ "$EVENT_NAME" = 'workflow_call' ]; then
            backend=true
            frontend=true
            browser=true
            kubernetes=true
            security=true
            documentation=true
          else
            if [ "$EVENT_NAME" = 'pull_request' ]; then
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
            else
              base="$BEFORE_SHA"
              head="$CURRENT_SHA"
              if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
                base="${head}^"
              fi
            fi

            while IFS= read -r path; do
              case "$path" in
                backend/*)
                  backend=true; browser=true; security=true ;;
                web/*)
                  frontend=true; browser=true; security=true ;;
                deploy/*)
                  kubernetes=true; security=true ;;
                .github/workflows/*)
                  backend=true; frontend=true; browser=true; kubernetes=true; security=true ;;
                .github/dependabot.yml|compose.yaml|.env.example|.dockerignore)
                  backend=true; frontend=true; browser=true; security=true ;;
                *.md|docs/*)
                  documentation=true ;;
                *)
                  security=true ;;
              esac
            done < <(git diff --name-only "$base" "$head")
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "browser=$browser"
            echo "kubernetes=$kubernetes"
            echo "security=$security"
            echo "documentation=$documentation"
          } >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-password"
          --health-interval=5s --health-timeout=3s --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        env:
          TEST_MYSQL_DSN: 'root:ci-test-password@tcp(127.0.0.1:3306)/?parseTime=true'
      - name: Check Go dependencies for known vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
          work-dir: backend
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@12.2.2
      - run: cp .env.example .env
      - name: Generate disposable audio fixture
        run: |
          mkdir -p assets/music assets/images/artwork
          node web/e2e/generate-audio.mjs assets/music/ci-tone.wav
      - name: Build each application image once
        run: docker compose build api web
      - run: docker compose up --no-build -d
      - run: |
          for attempt in $(seq 1 60); do
            if curl --fail http://localhost:8080/api/v1/catalog >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: npm ci
        working-directory: web
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        env:
          E2E_AUDIO_FIXTURE: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          path: web/test-results
      - run: docker compose logs
        if: failure()
      - run: docker compose down
        if: always()
  kubernetes:
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
      - run: kubectl kustomize deploy/k8s/base > /tmp/base.yaml
      - run: cp deploy/k8s/local/secrets.env.example deploy/k8s/local/secrets.env
      - run: kubectl kustomize deploy/k8s/local > /tmp/local.yaml
      - run: kubectl kustomize deploy/k8s/gitops > /tmp/gitops.yaml
      - run: kubectl kustomize deploy/argocd > /tmp/argocd.yaml
  security-config:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan repository and deployment configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  documentation:
    needs: changes
    if: needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@12.2.2
      - run: npm ci
        working-directory: web
      - name: Check Markdown formatting
        run: web/node_modules/.bin/prettier --check README.md SECURITY.md docs/*.md

  ci-gate:
    if: always()
    needs: [changes, backend, frontend, browser, kubernetes, security-config, documentation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER: ${{ needs.browser.result }}
          KUBERNETES: ${{ needs.kubernetes.result }}
          SECURITY: ${{ needs.security-config.result }}
          DOCUMENTATION: ${{ needs.documentation.result }}
        run: |
          [ "$CHANGES" = 'success' ]
          for result in "$BACKEND" "$FRONTEND" "$BROWSER" "$KUBERNETES" "$SECURITY" "$DOCUMENTATION"; do
            if [ "$result" != 'success' ] && [ "$result" != 'skipped' ]; then
              echo "A selected CI job did not pass: $result"
              exit 1
            fi
          done
