name: Test and package
on:
  push:
    branches: [development, master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      browser-mode: ${{ steps.paths.outputs.browser_mode }}
      browser-specs: ${{ steps.paths.outputs.browser_specs }}
      kubernetes: ${{ steps.paths.outputs.kubernetes }}
      security: ${{ steps.paths.outputs.security }}
      documentation: ${{ steps.paths.outputs.documentation }}
      container-images: ${{ steps.paths.outputs.container-images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        name: Select checks from changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          frontend=false; kubernetes=false; security=false; documentation=false
          container_web=false; force_full=false
          if [ "$EVENT_NAME" != push ] && [ "$EVENT_NAME" != pull_request ]; then
            frontend=true; kubernetes=true; security=true; documentation=true
            container_web=true; force_full=true
            : > /tmp/changed-paths
          else
            if [ "$EVENT_NAME" = pull_request ]; then
              base="$PR_BASE_SHA"; head="$PR_HEAD_SHA"
            else
              base="$BEFORE_SHA"; head="$CURRENT_SHA"
              if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
                base=$(git hash-object -t tree /dev/null)
              fi
            fi
            git diff --name-only "$base" "$head" > /tmp/changed-paths
            while IFS= read -r path; do
              case "$path" in
                web/*) frontend=true; security=true; container_web=true ;;
                deploy/*) kubernetes=true; security=true ;;
                scripts/select-studio-tests.sh|scripts/test-select-studio-tests.sh|scripts/select-delivery-images.sh|scripts/test-select-delivery-images.sh)
                  security=true ;;
                .github/workflows/*|scripts/*|compose.yaml)
                  frontend=true; kubernetes=true; security=true; force_full=true ;;
                .dockerignore) frontend=true; security=true; container_web=true; force_full=true ;;
                .github/dependabot.yml) security=true ;;
                *.md|docs/*) documentation=true ;;
                *) security=true ;;
              esac
            done < /tmp/changed-paths
          fi
          if [ "$EVENT_NAME" = pull_request ] && [ "$BASE_REF" = master ]; then force_full=true; fi
          FORCE_FULL_BROWSER="$force_full" bash scripts/select-studio-tests.sh < /tmp/changed-paths >> "$GITHUB_OUTPUT"
          bash scripts/test-select-studio-tests.sh
          bash scripts/test-select-delivery-images.sh
          {
            echo "frontend=$frontend"
            echo "kubernetes=$kubernetes"
            echo "security=$security"
            echo "documentation=$documentation"
            echo "container-images=$container_web"
          } >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    needs: changes
    if: needs.changes.outputs.browser-mode != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@12.2.2
      - run: npm ci
        working-directory: web
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install chromium
        working-directory: web
      - name: Run selected studio journeys
        working-directory: web
        env:
          BROWSER_MODE: ${{ needs.changes.outputs.browser-mode }}
          STUDIO_SPECS: ${{ needs.changes.outputs.browser-specs }}
        run: |
          if [ "$BROWSER_MODE" = full ]; then
            npm run build
            docker run --detach --rm --name studio-browser --read-only --tmpfs /tmp \
              --cap-drop ALL --security-opt no-new-privileges:true \
              --publish 127.0.0.1:18080:8080 \
              --volume "$GITHUB_WORKSPACE/web/dist:/usr/share/nginx/html:ro" \
              --volume "$GITHUB_WORKSPACE/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
              nginxinc/nginx-unprivileged:1.31-alpine
            trap 'docker stop studio-browser >/dev/null 2>&1 || true' EXIT
            export E2E_BASE_URL=http://127.0.0.1:18080 DEPLOYED_AUDIO_SMOKE=1
          else
            npm run dev > /tmp/bedlam-studio.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            export E2E_BASE_URL=http://127.0.0.1:5173
          fi
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$E2E_BASE_URL/" >/dev/null; then break; fi
            if [ "$attempt" = 60 ]; then exit 1; fi
            sleep 1
          done
          if [ "$BROWSER_MODE" = full ]; then
            npx playwright test
          else
            read -r -a specs <<< "$STUDIO_SPECS"
            [ "${#specs[@]}" -gt 0 ]
            npx playwright test "${specs[@]}"
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure
          path: web/test-results

  containers:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.container-images == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: bedlam-like-music-web:ci
          cache-from: type=gha,scope=web-amd64
          cache-to: type=gha,mode=max,scope=web-amd64

  kubernetes:
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
      - name: Render application, Argo CD, and observability
        run: |
          for overlay in base local test production; do
            kubectl kustomize "deploy/k8s/$overlay" > "/tmp/$overlay.yaml"
          done
          kubectl kustomize deploy/argocd > /tmp/argocd.yaml
          kubectl kustomize deploy/argocd/production-template > /tmp/argocd-production.yaml
          kubectl kustomize deploy/observability > /tmp/observability.yaml

  dependency-review:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # Official MIT-licensed Actions with missing dependency graph metadata.
          allow-dependencies-licenses: >-
            pkg:githubactions/actions/checkout,
            pkg:githubactions/azure/setup-kubectl

  security-config:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivyignores: .trivyignore.yaml
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  documentation:
    needs: changes
    if: needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@12.2.2
      - run: npm ci
        working-directory: web
      - run: web/node_modules/.bin/prettier --check README.md SECURITY.md docs/*.md

  ci-gate:
    if: always()
    needs:
      [
        changes,
        frontend,
        browser,
        containers,
        kubernetes,
        security-config,
        documentation,
        dependency-review,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER: ${{ needs.browser.result }}
          BROWSER_MODE: ${{ needs.changes.outputs.browser-mode }}
          CONTAINERS: ${{ needs.containers.result }}
          KUBERNETES: ${{ needs.kubernetes.result }}
          SECURITY: ${{ needs.security-config.result }}
          DOCUMENTATION: ${{ needs.documentation.result }}
          DEPENDENCIES: ${{ needs.dependency-review.result }}
          EXPECT_FRONTEND: ${{ needs.changes.outputs.frontend }}
          EXPECT_KUBERNETES: ${{ needs.changes.outputs.kubernetes }}
          EXPECT_SECURITY: ${{ needs.changes.outputs.security }}
          EXPECT_DOCUMENTATION: ${{ needs.changes.outputs.documentation }}
          EXPECT_CONTAINERS: ${{ github.event_name == 'pull_request' && needs.changes.outputs.container-images == 'true' }}
          EXPECT_DEPENDENCIES: ${{ github.event_name == 'pull_request' }}
        run: |
          [ "$CHANGES" = success ]
          require_selected() {
            if [ "$2" = true ] && [ "$3" != success ]; then
              echo "$1 was selected but did not succeed: $3"; exit 1
            fi
          }
          require_selected frontend "$EXPECT_FRONTEND" "$FRONTEND"
          require_selected kubernetes "$EXPECT_KUBERNETES" "$KUBERNETES"
          require_selected security "$EXPECT_SECURITY" "$SECURITY"
          require_selected documentation "$EXPECT_DOCUMENTATION" "$DOCUMENTATION"
          require_selected containers "$EXPECT_CONTAINERS" "$CONTAINERS"
          require_selected dependency-review "$EXPECT_DEPENDENCIES" "$DEPENDENCIES"
          case "$BROWSER_MODE" in
            full|studio) [ "$BROWSER" = success ] ;;
            none) [ "$BROWSER" = skipped ] ;;
            *) exit 1 ;;
          esac
          for result in "$FRONTEND" "$BROWSER" "$CONTAINERS" "$KUBERNETES" "$SECURITY" "$DOCUMENTATION" "$DEPENDENCIES"; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then exit 1; fi
          done

  deliver-test:
    needs: ci-gate
    if: >-
      always() && needs.ci-gate.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/development'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/cd.yml
    with:
      environment: test
      source_branch: development
      target_branch: deploy/test
      target_overlay: deploy/k8s/test

  deliver-production:
    needs: ci-gate
    if: >-
      always() && needs.ci-gate.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/cd.yml
    with:
      environment: production
      source_branch: master
      target_branch: deploy/production
      target_overlay: deploy/k8s/production
