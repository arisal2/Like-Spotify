name: Build and promote

on:
  workflow_run:
    workflows: ['Test and package']
    types: [completed]

permissions:
  contents: write
  packages: write

concurrency:
  group: gitops-local
  cancel-in-progress: false

jobs:
  changes:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.paths.outputs.api }}
      web: ${{ steps.paths.outputs.web }}
      promote: ${{ steps.paths.outputs.promote }}
      images: ${{ steps.paths.outputs.images }}
      matrix: ${{ steps.paths.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: paths
        name: Select images and promotion from changed paths
        shell: bash
        run: |
          api=false
          web=false
          deploy=false

          while IFS= read -r path; do
            case "$path" in
              backend/*)
                api=true ;;
              web/*)
                web=true ;;
              .dockerignore)
                api=true; web=true ;;
              deploy/*)
                deploy=true ;;
            esac
          done < <(git diff --name-only HEAD^ HEAD)

          images=false
          if [ "$api" = true ] || [ "$web" = true ]; then images=true; fi
          promote=false
          if [ "$images" = true ] || [ "$deploy" = true ]; then promote=true; fi

          include='[]'
          if [ "$api" = true ]; then
            include=$(jq -c '. + [{"component":"api","dockerfile":"backend/Dockerfile"}]' <<< "$include")
          fi
          if [ "$web" = true ]; then
            include=$(jq -c '. + [{"component":"web","dockerfile":"web/Dockerfile"}]' <<< "$include")
          fi

          {
            echo "api=$api"
            echo "web=$web"
            echo "promote=$promote"
            echo "images=$images"
            echo "matrix={\"include\":$include}"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "repository=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/${{ matrix.component }}:${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ steps.image.outputs.repository }}/${{ matrix.component }}:main
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  promote:
    needs: [changes, publish]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.promote == 'true' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Ensure this is still the newest tested revision
        id: revision
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$DEPLOY_SHA" ]; then
            echo 'promote=true' >> "$GITHUB_OUTPUT"
          else
            echo 'promote=false' >> "$GITHUB_OUTPUT"
            echo 'A newer revision is already on master; its CI run will promote it.'
          fi
      - name: Pin GitOps images to the tested revision
        if: steps.revision.outputs.promote == 'true'
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/deploy/local >/dev/null; then
            git fetch origin refs/heads/deploy/local:refs/remotes/origin/deploy/local
            previous_api=$(git show refs/remotes/origin/deploy/local:deploy/k8s/gitops/kustomization.yaml | awk '/newName: .*\/api$/ { getline; if ($1 == "newTag:") print $2 }')
            previous_web=$(git show refs/remotes/origin/deploy/local:deploy/k8s/gitops/kustomization.yaml | awk '/newName: .*\/web$/ { getline; if ($1 == "newTag:") print $2 }')
            git switch -c deploy-local refs/remotes/origin/deploy/local
            # Keep the deployment branch history while replacing its tree with
            # the tested revision. This runs only in the disposable CI checkout.
            git read-tree --reset -u "$DEPLOY_SHA"
          else
            git switch -c deploy-local
            previous_api="$DEPLOY_SHA"
            previous_web="$DEPLOY_SHA"
          fi

          api_tag="$previous_api"
          web_tag="$previous_web"
          if [ "$API_CHANGED" = 'true' ]; then api_tag="$DEPLOY_SHA"; fi
          if [ "$WEB_CHANGED" = 'true' ]; then web_tag="$DEPLOY_SHA"; fi
          if [ -z "$api_tag" ] || [ -z "$web_tag" ]; then
            echo 'Could not determine the previously deployed image tags.'
            exit 1
          fi

          sed -i "/newName: .*\/api$/ { n; s/newTag: .*/newTag: ${api_tag}/; }" deploy/k8s/gitops/kustomization.yaml
          sed -i "/newName: .*\/web$/ { n; s/newTag: .*/newTag: ${web_tag}/; }" deploy/k8s/gitops/kustomization.yaml
      - name: Validate rendered manifests
        if: steps.revision.outputs.promote == 'true'
        run: kubectl kustomize deploy/k8s/gitops > /tmp/bedlam-like-music-gitops.yaml
      - name: Commit the deployment revision
        if: steps.revision.outputs.promote == 'true'
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'GitOps overlay already points at this revision.'
            exit 0
          fi
          git commit -m "deploy: ${DEPLOY_SHA} [skip ci]"
          # Refuse to promote if master changed while preparing this deployment.
          if [ "$(git ls-remote origin refs/heads/master | cut -f1)" != "$DEPLOY_SHA" ]; then
            echo 'A newer master revision exists; skipping promotion.'
            exit 0
          fi
          git push origin HEAD:refs/heads/deploy/local
