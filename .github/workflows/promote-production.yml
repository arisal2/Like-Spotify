name: Promote production

on:
  workflow_run:
    workflows: ["Test and package"]
    types: [completed]
  workflow_dispatch:
    inputs:
      test_gitops_sha:
        description: Exact verified head SHA of deploy/test
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gitops-production
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: azure/setup-kubectl@v5
      - name: Verify the approved test state
        env:
          APPROVED_SHA: ${{ inputs.test_gitops_sha }}
          TESTED_MAIN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$TESTED_MAIN_SHA" ] || { echo 'main moved; refusing stale promotion'; exit 1; }
          git fetch origin refs/heads/deploy/test:refs/remotes/origin/deploy/test
          actual_sha=$(git rev-parse refs/remotes/origin/deploy/test)
          if [ -z "$APPROVED_SHA" ]; then APPROVED_SHA="$actual_sha"; fi
          source_sha=$(git show "${APPROVED_SHA}:.delivery-source")
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git diff --exit-code "${source_sha}^{tree}" 'HEAD^{tree}' -- .
          echo "APPROVED_TEST_SHA=$APPROVED_SHA" >> "$GITHUB_ENV"
          if [ "$actual_sha" != "$APPROVED_SHA" ]; then
            echo "deploy/test moved: expected $APPROVED_SHA, found $actual_sha"
            exit 1
          fi
          for image in api web; do
            tag=$(git show "${APPROVED_SHA}:deploy/k8s/test/kustomization.yaml" | awk -v image="$image" '$0 ~ "newName: .*/" image "$" { getline; if ($1 == "newTag:") print $2 }')
            if ! printf '%s' "$tag" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Test $image image is not pinned to an immutable commit SHA."
              exit 1
            fi
          done
      - name: Promote the exact tested image set
        env:
          APPROVED_SHA: ${{ env.APPROVED_TEST_SHA }}
        run: |
          test_api=$(git show "${APPROVED_SHA}:deploy/k8s/test/kustomization.yaml" | awk '/newName: .*\/api$/ { getline; if ($1 == "newTag:") print $2 }')
          test_web=$(git show "${APPROVED_SHA}:deploy/k8s/test/kustomization.yaml" | awk '/newName: .*\/web$/ { getline; if ($1 == "newTag:") print $2 }')

          if git ls-remote --exit-code --heads origin refs/heads/deploy/production >/dev/null; then
            git fetch origin refs/heads/deploy/production:refs/remotes/origin/deploy/production
            git switch -c promote-production refs/remotes/origin/deploy/production
          else
            git switch -c promote-production
          fi
          git read-tree --reset -u "$APPROVED_SHA"
          sed -i "/newName: .*\/api$/ { n; s/newTag: .*/newTag: ${test_api}/; }" deploy/k8s/production/kustomization.yaml
          sed -i "/newName: .*\/web$/ { n; s/newTag: .*/newTag: ${test_web}/; }" deploy/k8s/production/kustomization.yaml
          kubectl kustomize deploy/k8s/production > /tmp/bedlam-like-music-production.yaml
      - name: Commit production desired state
        env:
          APPROVED_SHA: ${{ env.APPROVED_TEST_SHA }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Production already matches this tested state.'
            exit 0
          fi
          git commit -m "deploy(production): ${APPROVED_SHA} [skip ci]"
          expected_main=${{ github.event.workflow_run.head_sha || github.sha }}
          [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$expected_main" ] || exit 1
          git push origin HEAD:refs/heads/deploy/production
